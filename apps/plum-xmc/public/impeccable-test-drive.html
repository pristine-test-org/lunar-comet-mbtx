<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plum · Impeccable test drive</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fafaf7; color: #1c1c1c; }
      header { padding: 1.25rem 1rem; max-width: 44rem; margin: 0 auto; }
      header a { color: #3b4bc8; }
      main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem; }
      /* Intentional, for Impeccable's test drive: gradient text on the heading. */
      h1 {
        font-size: 2.5rem; margin: 0 0 1rem;
        background: linear-gradient(90deg, #3b4bc8, #d6336c);
        -webkit-background-clip: text; background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent;
      }
      /* Intentional, for Impeccable's test drive: light grey text well under 4.5:1 contrast. */
      .note { color: #c4c4c4; }
      /* Intentional, for Impeccable's test drive: link text under the 11px floor. */
      .small-link { font-size: 10px; color: #3b4bc8; }
      /* Intentional, for Impeccable's test drive: a layout property in a transition. */
      .bar { height: 0.5rem; width: 30%; background: #3b4bc8; transition: width 0.3s; }
      .bar:hover { width: 100%; }
      /* Intentional, for Impeccable's test drive: body text flush with the viewport edge, no background. */
      .edge { margin: 2rem calc(50% - 50vw) 0; padding: 0; width: 100vw; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header><a href="/">Back to Plum</a></header>
    <main>
      <h1>Plum test drive</h1>
      <p>A small page added for Impeccable to review: the board, at a glance.</p>
      <p class="note">A quiet note about this page, kept deliberately pale.</p>
      <div class="bar" aria-hidden="true"></div>
      <p><a class="small-link" href="/">Return to the list</a></p>
      <p class="edge">This paragraph runs the full width of the window with no padding at all, so its text touches both edges of the screen.</p>
    </main>
  </body>
</html>
